<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tienda de Importado</title>
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/pages.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand-block">
        <div class="brand-mark">TI</div>
        <div class="brand-copy">
          <strong>Tienda de Importado</strong>
          <span>Gestión interna</span>
        </div>
      </div>

      <nav class="main-nav" id="mainNav" aria-label="Navegación principal"></nav>

      <div class="sidebar-footer">
        <div class="user-mini">
          <div class="avatar">M</div>
          <div>
            <strong>Maru</strong>
            <span>Admin</span>
          </div>
        </div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <button class="icon-button mobile-only" id="menuButton" aria-label="Abrir menú">☰</button>
        <div>
          <div class="eyebrow">Tienda de Importado</div>
          <h1 id="pageTitle">Dashboard</h1>
        </div>
        <div class="topbar-actions">
          <button class="button button-ghost" type="button">Ayuda</button>
          <button class="icon-button" type="button" aria-label="Notificaciones">○</button>
        </div>
      </header>

      <section class="content-wrap">
        <div class="watermark-layer" aria-hidden="true"></div>
        <div id="pageRoot" class="page-root"></div>
      </section>
    </main>
  </div>

  <div class="mobile-backdrop" id="mobileBackdrop"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
