<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tienda de Importado</title>
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/pages.css" />
</head>
<body>
  <section class="auth-gate" id="authGate">
    <form class="login-card" id="loginForm">
      <div class="brand-mark login-mark">TI</div>
      <div>
        <div class="module-kicker">GESTIÓN INTERNA</div>
        <h1>Tienda de Importado</h1>
        <p>Ingresá con tu usuario o con la clave operativa de administración.</p>
      </div>
      <label>Usuario<input name="username" value="Maru" autocomplete="username" required /></label>
      <label>Contraseña<input name="password" type="password" autocomplete="current-password" required /></label>
      <button class="button button-primary" type="submit">Ingresar</button>
      <p class="form-error" id="loginError"></p>
    </form>
  </section>

  <div class="app-shell is-hidden" id="appShell">
    <aside class="sidebar" id="sidebar">
      <div class="brand-block">
        <div class="brand-mark">TI</div>
        <div class="brand-copy">
          <strong>Tienda de Importado</strong>
          <span>Gestión interna</span>
        </div>
      </div>

      <nav class="main-nav" id="mainNav" aria-label="Navegación principal"></nav>

      <div class="sidebar-footer">
        <div class="user-mini">
          <div class="avatar" id="userAvatar">M</div>
          <div>
            <strong id="userName">—</strong>
            <span id="userRole">—</span>
          </div>
        </div>
        <button class="logout-button" id="logoutButton" type="button">Cerrar sesión</button>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <button class="icon-button mobile-only" id="menuButton" aria-label="Abrir menú">☰</button>
        <div>
          <div class="eyebrow">Tienda de Importado</div>
          <h1 id="pageTitle">Dashboard</h1>
        </div>
        <div class="topbar-actions">
          <span class="connection-state" id="connectionState">Conectando…</span>
        </div>
      </header>

      <section class="content-wrap">
        <div class="watermark-layer" aria-hidden="true"></div>
        <div id="pageRoot" class="page-root"></div>
      </section>
    </main>
  </div>

  <div class="mobile-backdrop" id="mobileBackdrop"></div>
  <dialog class="app-dialog" id="appDialog"></dialog>
  <div class="toast" id="toast" role="status"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
